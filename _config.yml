# Basic Site Settings
locale                   : "en-US"
site_theme               : "default"
title                    : "Junteng Liu's Homepage"
title_separator          : "-"
name                     : "Junteng Liu"
description              : "Junteng Liu is a Ph.D. candidate in Computer Science at the Hong Kong University of Science and Technology (HKUST NLP Group), researching natural language processing and machine learning."
url                      : https://ceilingcocoonseek54.github.io
baseurl                  : "/LJT-Homepage"
repository               : "ceilingcocoonseek54/LJT-Homepage"

# Site Author - content appears in the sidebar author profile
author:
  avatar           : "profile.png"
  name             : "Junteng Liu"
  bio              : "Ph.D. candidate in Computer Science at HKUST NLP Group. Research focuses on natural language processing and machine learning."
  location         : "Hong Kong"
  employer         : "Hong Kong University of Science and Technology"
  email            : "jliugi@connect.ust.hk"
  googlescholar    : "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
  github           : "Vicent0205"
  twitter          : "junteng88716710"

# Publication Category - list of publication categories and their headings
publication_category:
  books:
    title: 'Books'
  manuscripts:
    title: 'Preprints'
  conferences:
    title: 'Conference Papers'

# Reading Files
include:
  - _pages
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  header_links: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Collections
collections:
  publications:
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  # _publications
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: Etc/UTC

# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Mimic GitHub Pages with --safe
whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
